[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigchange-actioner"
version = "0.1.0"
description = "Action completed BigChange JobWatch jobs through the legacy Web Services API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bigchange-actioner = "bigchange_actioner.cli:main"

[tool.setuptools.packages.find]
include = ["bigchange_actioner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
