name: Aquilo BigChange KPI Overview Report

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aquilo-bigchange-kpi-overview-report
  cancel-in-progress: false

jobs:
  send-report:
    name: Generate and email KPI report
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BIGCHANGE_AUTH_MODE: api_key
      BIGCHANGE_BASE_URL: https://webservice.bigchange.com/v01/services.ashx
      BIGCHANGE_API_KEY: ${{ secrets.BIGCHANGE_API_KEY }}
      BIGCHANGE_USERNAME: ${{ secrets.BIGCHANGE_USERNAME }}
      BIGCHANGE_PASSWORD: ${{ secrets.BIGCHANGE_PASSWORD }}
      FRESHDESK_SUBDOMAIN: nirvanamaintenance.freshdesk.com
      FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_API_KEY }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
      SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME || 'Daniel Dwyer' }}
      SMTP_TO_EMAIL: ${{ secrets.SMTP_TO_EMAIL }}
      SMTP_CC_EMAIL: ${{ secrets.SMTP_CC_EMAIL }}
      STAFF_NAME_ALIASES: ${{ vars.STAFF_NAME_ALIASES }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Generate dashboard and send email
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python3 scripts/bigchange_kpi_report.py

      - name: Upload dashboard PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquilo-bigchange-kpi-dashboard
          path: reports/bigchange-kpi-dashboard.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit KPI baseline
        if: success()
        run: |
          if ! git diff --quiet -- automation-memory/kpi-baseline.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation-memory/kpi-baseline.json
            git commit -m "Update KPI baseline snapshot"
            git push
          fi
