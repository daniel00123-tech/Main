name: Aquilo BigChange KPI Overview Report

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kpi-overview-report:
    name: Generate and email KPI overview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run KPI report
        id: run-report
        env:
          BIGCHANGE_AUTH_MODE: api_key
          BIGCHANGE_BASE_URL: https://webservice.bigchange.com/v01/services.ashx
          BIGCHANGE_API_KEY: ${{ secrets.BIGCHANGE_API_KEY }}
          BIGCHANGE_USERNAME: ${{ secrets.BIGCHANGE_USERNAME }}
          BIGCHANGE_PASSWORD: ${{ secrets.BIGCHANGE_PASSWORD }}
          FRESHDESK_SUBDOMAIN: ${{ secrets.FRESHDESK_SUBDOMAIN }}
          FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_TO_EMAIL: ${{ secrets.SMTP_TO_EMAIL }}
          SMTP_CC_EMAIL: ${{ secrets.SMTP_CC_EMAIL }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set +e
          python3 scripts/bigchange_kpi_report.py
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload dashboard PNG
        if: always() && hashFiles('reports/bigchange-kpi-dashboard.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bigchange-kpi-dashboard
          path: reports/bigchange-kpi-dashboard.png
          if-no-files-found: error

      - name: Commit KPI baseline
        if: always()
        run: |
          if git diff --quiet -- automation-memory/kpi-baseline.json; then
            echo "No KPI baseline changes to commit."
            exit 0
          fi
          git add automation-memory/kpi-baseline.json
          git commit -m "Update daily KPI baseline [skip ci]"
          git push

      - name: Fail workflow if report failed
        if: steps.run-report.outputs.exit_code != '0'
        run: exit 1
