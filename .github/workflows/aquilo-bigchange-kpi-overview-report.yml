name: Aquilo BigChange KPI Overview Report

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-report:
    name: Send daily KPI report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BIGCHANGE_AUTH_MODE: api_key
      BIGCHANGE_BASE_URL: https://webservice.bigchange.com/v01/services.ashx
      BIGCHANGE_API_KEY: ${{ secrets.BIGCHANGE_API_KEY }}
      BIGCHANGE_USERNAME: ${{ secrets.BIGCHANGE_USERNAME }}
      BIGCHANGE_PASSWORD: ${{ secrets.BIGCHANGE_PASSWORD }}
      FRESHDESK_SUBDOMAIN: nirvanamaintenance.freshdesk.com
      FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_API_KEY }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      SMTP_TO_EMAIL: ${{ secrets.SMTP_TO_EMAIL }}
      SMTP_CC_EMAIL: ${{ secrets.SMTP_CC_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run KPI report
        id: report
        shell: bash
        run: |
          set +e
          python3 scripts/bigchange_kpi_report.py
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload dashboard PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigchange-kpi-dashboard
          path: reports/bigchange-kpi-dashboard.png
          if-no-files-found: warn

      - name: Commit KPI baseline
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- automation-memory/kpi-baseline.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation-memory/kpi-baseline.json
          git commit -m "Update KPI baseline snapshot"
          git push -u origin "$GITHUB_REF_NAME"

      - name: Fail if report did not send
        if: steps.report.outputs.exit_code != '0'
        run: exit 1
