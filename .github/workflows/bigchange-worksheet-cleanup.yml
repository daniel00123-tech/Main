name: BigChange worksheet cleanup

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BIGCHANGE_AUTH_MODE: api_key
      BIGCHANGE_BASE_URL: https://webservice.bigchange.com/v01/services.ashx
      BIGCHANGE_API_KEY: ${{ secrets.BIGCHANGE_API_KEY }}
      BIGCHANGE_USERNAME: ${{ secrets.BIGCHANGE_USERNAME }}
      BIGCHANGE_PASSWORD: ${{ secrets.BIGCHANGE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Clean up today's completed worksheets
        run: python3 scripts/bigchange_worksheet_cleanup.py
