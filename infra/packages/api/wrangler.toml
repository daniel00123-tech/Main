name = "infra-api"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "infra-control-plane"
database_id = "adacb84d-7ee8-4b27-87ff-3d554b563d71"
migrations_dir = "../../migrations"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://app.infrastack.app,https://infrastack.app,https://infra-web.pages.dev,http://localhost:5173,http://127.0.0.1:5173,https://chatgpt.com,https://chat.openai.com,https://claude.ai"
COOKIE_CROSS_ORIGIN = "false"
# Host-only cookies on app.infrastack.app. Legacy pages.dev company subdomains still use .infra-web.pages.dev when the request Origin is that host.
PORTAL_PUBLIC_ORIGIN = "https://app.infrastack.app"
INFRA_PUBLIC_API_URL = "https://api.infrastack.app"
INFRA_PUBLIC_MCP_URL = "https://mcp.infrastack.app"
PORTAL_BASE_DOMAIN = "infra-web.pages.dev"

# Secrets (set via `wrangler secret put` — never commit):
# SESSION_SECRET
# CADDINGTON_MCP_AUTH_TOKEN (referenced by mcp_environments.auth_secret_ref)
# HT_MCP_AUTH_TOKEN (downstream auth for existing ht-business-mcp — same value as that Worker's MCP_AUTH_TOKEN)
# EL_MCP_AUTH_TOKEN (downstream auth for existing el-business-mcp — same value as that Worker's MCP_AUTH_TOKEN)
# STRIPE_SECRET_KEY (optional — prepaid top-ups)
# STRIPE_WEBHOOK_SECRET (legacy workers.dev webhook signing secret)
# STRIPE_WEBHOOK_SECRET_INFRASTACK (canonical api.infrastack.app webhook signing secret)
# INFRA_CREDENTIAL_WRAPPING_KEY (32-byte AES-256 wrapping key; never put in D1)
# INFRA_CREDENTIAL_KEY_VERSION (optional, default v1)
# XERO_CLIENT_ID (Xero Web App client id; never put in D1)
# XERO_CLIENT_SECRET (Xero Web App client secret; never put in D1)
# XERO_OAUTH_REDIRECT_URI (canonical: https://api.infrastack.app/api/connectors/xero/oauth/callback)
# Graph webhook URL is derived from INFRA_PUBLIC_API_URL — do not add MICROSOFT_GRAPH_NOTIFICATION_URL
# INFRA_PUBLIC_MCP_URL (canonical MCP host — https://mcp.infrastack.app)
# PORTAL_PUBLIC_ORIGIN (canonical portal — https://app.infrastack.app)
# MICROSOFT_TENANT_ID (Microsoft Entra tenant ID — Caddington Holdings / shared platform)
# MICROSOFT_CLIENT_ID (INFRA Business Connector — do not reuse for co_el)
# MICROSOFT_CLIENT_SECRET (shared/Caddington app secret — never commit, never overwrite for EL)
# EL_MS_TENANT_ID / EL_MS_CLIENT_ID (co_el tenant-native Graph public IDs)
# EL_MS_CLIENT_SECRET (co_el tenant-native Graph — do not overwrite MICROSOFT_CLIENT_SECRET)
# Do not rotate or replace the global MICROSOFT_* triplet when adding EL-native credentials.
# CADDINGTON_ADMIN_TOKEN (matches caddington-mcp Worker secret for /admin/knowledge/* bridge)
# AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT (https://infra-document-intelligence-prod.cognitiveservices.azure.com)
# AZURE_DOCUMENT_INTELLIGENCE_KEY (Azure AI Document Intelligence key — never commit)
# AZURE_OCR_MAX_PAGES (optional, default 50)
# AZURE_OCR_MAX_BYTES (optional, default 20971520)
# WHATSAPP_WEBHOOK_VERIFY_TOKEN (Meta hub.verify_token — wrangler secret put)
# WHATSAPP_ACCESS_TOKEN (Cloud API user token — wrangler secret put)
# WHATSAPP_REGISTRATION_PIN (optional 6-digit Cloud API two-step PIN — wrangler secret put)
# META_APP_SECRET (X-Hub-Signature-256 — wrangler secret put)
# OPENAI_API_KEY (optional Whisper + OpenAI reasoning brain — wrangler secret put, never commit)
# Global mode stays openai_shadow for unscoped/automation traffic.
# Allowlisted PA / WhatsApp requests use OpenAI as the user-visible brain.
# EL stays on the allowlist. Caddington PA/request is user-visible OpenAI. HT is omitted.
# ChatGPT / MCP stay direct tools. Do not set openai_primary here.
OPENAI_BRAIN_ENABLED = "true"
OPENAI_BRAIN_MODE = "openai_shadow"
OPENAI_BRAIN_COMPANY_IDS = "co_el,co_caddington"
OPENAI_BRAIN_PA_REQUEST_PRIMARY = "true"
# Optional per-company override. Unlisted companies stay Cloudflare.
# OPENAI_BRAIN_COMPANY_MODES = "co_el=openai_shadow,co_caddington=openai_shadow"
OPENAI_BRAIN_CANARY_PERCENT = "10"
OPENAI_MODEL_FAST = "gpt-5.6-luna"
OPENAI_MODEL_DEFAULT = "gpt-5.6-terra"
OPENAI_MODEL_REASONING = "gpt-5.6-sol"
EMAIL_FROM_NAME = "Infra"
EMAIL_FROM_ADDRESS = "noreply@infrastack.app"
# Public EL-native Microsoft identity (Option B). Secret stays in wrangler secret storage as EL_MS_CLIENT_SECRET.
EL_MS_TENANT_ID = "af32e619-3647-44a2-85d9-1c45457c0e91"
EL_MS_CLIENT_ID = "f8ec6a91-f043-4f63-8800-64135af48c4e"
EL_MICROSOFT_APP_DISPLAY_NAME = "INFRA - Elvex MCP"
WHATSAPP_PHONE_NUMBER_ID = "1338434179351224"
WHATSAPP_BUSINESS_ACCOUNT_ID = "1629422285251338"
WHATSAPP_OUTBOUND_AI_ENABLED = "true"

# Same-account Worker MCP access (workers.dev public fetch returns CF 1042)
[[services]]
binding = "CADDINGTON_MCP"
service = "caddington-mcp"

[[services]]
binding = "HT_BUSINESS_MCP"
service = "ht-business-mcp"

[[services]]
binding = "EL_BUSINESS_MCP"
service = "el-business-mcp"

[triggers]
crons = ["0 */6 * * *", "*/15 * * * *", "* * * * *"]

# Microsoft knowledge ingestion queue (CMD15 — production bound).
# Self-fetch job processor remains fallback when binding is unavailable.
[[queues.producers]]
binding = "MICROSOFT_KNOWLEDGE_QUEUE"
queue = "microsoft-knowledge-ingest"

# Automation run queue — Workers Paid quota now covers this plus Microsoft ingest.
[[queues.producers]]
binding = "AUTOMATION_RUN_QUEUE"
queue = "automation-runs"

[[queues.consumers]]
queue = "automation-runs"
max_batch_size = 1
max_retries = 5
dead_letter_queue = "automation-runs-dlq"

[[queues.consumers]]
queue = "automation-runs-dlq"
max_batch_size = 10

[[queues.consumers]]
queue = "microsoft-knowledge-ingest"
max_batch_size = 1
max_retries = 5
dead_letter_queue = "microsoft-knowledge-ingest-dlq"

[[queues.consumers]]
queue = "microsoft-knowledge-ingest-dlq"
max_batch_size = 10

# WhatsApp inbound webhook — ack Meta immediately, process off-request.
[[queues.producers]]
binding = "WHATSAPP_INBOUND_QUEUE"
queue = "whatsapp-inbound"

[[queues.consumers]]
queue = "whatsapp-inbound"
max_batch_size = 1
max_concurrency = 8
max_retries = 5
dead_letter_queue = "whatsapp-inbound-dlq"

[[queues.consumers]]
queue = "whatsapp-inbound-dlq"
max_batch_size = 10

# Independent WhatsApp watchdog — delayed messages, never sleeps in the inbound consumer.
[[queues.producers]]
binding = "WHATSAPP_WATCHDOG_QUEUE"
queue = "whatsapp-watchdog"

[[queues.consumers]]
queue = "whatsapp-watchdog"
max_batch_size = 1
max_concurrency = 5
max_retries = 3
dead_letter_queue = "whatsapp-watchdog-dlq"

[[queues.consumers]]
queue = "whatsapp-watchdog-dlq"
max_batch_size = 5

# Workers AI — WhatsApp voice transcription and document-grounded text generation.
# Optional override: wrangler secret/var WHATSAPP_GROUNDED_MODEL (never invent keys).
[ai]
binding = "AI"

# Cloudflare Email Service — transactional send from Infra <noreply@infrastack.app>
[[send_email]]
name = "EMAIL"

